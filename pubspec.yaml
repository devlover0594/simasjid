name: simasjid
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.5
  http: ^1.3.0
  flutter_analog_clock: ^1.0.3
  video_player: ^2.9.2
  path_provider: ^2.1.4
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  mime: ^2.0.0
  just_audio: ^0.9.41
  audioplayers: ^6.2.0
  device_info_plus: ^10.0.0
  permission_handler: ^11.0.1
  file_picker: ^11.0.2
  dartssh2: 2.22.0

  uuid: ^4.4.0 # Added for unique display ID generation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true

  assets:
    - assets/themes/default/
    - assets/themes/default/card.png
    - assets/themes/default/slide.png
    - assets/themes/default/header.png
    - assets/themes/default/jam.png
    - assets/audio/tarhim.mp3
    - assets/audio/adzan.mp3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon.png"
